# Installed by `crew init`. Runs the pm role on a GitHub Actions runner on a schedule (cron is UTC; GitHub may
# delay or drop runs under load, vendor-doc). Stagger it away from the worker and lead minutes (:41 here) and away
# from :00 and :30. The pm mostly reads and plans, so a daily run at an off-peak hour is a sensible start.
name: crew-schedule-pm

on:
  schedule:
    - cron: "41 7 * * 1-5"
  workflow_dispatch:
    inputs:
      prompt_extra:
        description: Extra instruction for this run
        default: ""

jobs:
  run:
    uses: <HARNESS_REPO>/.github/workflows/role-run.yml@<HARNESS_REF>
    with:
      role: pm
      kind: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
      prompt_extra: ${{ inputs.prompt_extra }}
      plan_repo: <PLAN_REPO>
      harness_repo: <HARNESS_REPO>
      harness_ref: <HARNESS_REF>
    secrets: inherit

# Installed by `crew init`. Runs the lead role on a GitHub Actions runner on a schedule (cron is UTC; GitHub may
# delay or drop runs under load, vendor-doc). Stagger it away from the worker and pm minutes (:23 here) and away
# from :00 and :30. The lead is cheaper idle than a worker, so a few runs a day is usually enough.
name: crew-schedule-lead

on:
  schedule:
    - cron: "23 6,10,13,22 * * *"
  workflow_dispatch:
    inputs:
      prompt_extra:
        description: Extra instruction for this run
        default: ""

permissions:   # a reusable workflow can only use what its caller grants: role-run.yml needs all of these
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  run:
    uses: <HARNESS_REPO>/.github/workflows/role-run.yml@<HARNESS_REF>
    with:
      role: lead
      kind: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
      prompt_extra: ${{ inputs.prompt_extra }}
      plan_repo: <PLAN_REPO>
      harness_repo: <HARNESS_REPO>
      harness_ref: <HARNESS_REF>
    secrets: inherit

# Installed by `crew init` in each CODE repo. Provides the `merge-ready` status: make it a required check on the
# default branch. No logic here: the checks, reviewer tiers and allowed bots come from the harness and crew.json.
# Needs the CLAUDE_CODE_OAUTH_TOKEN secret. When the plan repo is private, also the CREW_APP_ID variable plus the
# CREW_APP_KEY secret (the crew's GitHub App), or a CREW_REPO_TOKEN secret that can read the plan repo.
# Optional `with:` inputs: model (used when crew.json has no review.tiers, and as the fallback), max_turns, mention.
name: crew-review

on:
  pull_request:
    types: [auto_merge_enabled, synchronize]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

jobs:
  review:
    uses: <HARNESS_REPO>/.github/workflows/review.yml@<HARNESS_REF>
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      id-token: write
      actions: read
    with:
      plan_repo: <PLAN_REPO>
      harness_repo: <HARNESS_REPO>
      harness_ref: <HARNESS_REF>
    secrets: inherit

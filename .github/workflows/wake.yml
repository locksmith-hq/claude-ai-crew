name: crew-wake-reusable

# Reusable: wakes routines for the signals they cannot subscribe to. Who wakes whom lives in the plan repo's
# crew.json and scripts/route.sh (debate turn cap included); this file only filters events cheaply and fires.
# Triggers cannot live in a reusable workflow: install templates/callers/crew-wake.yml (in the plan repo for
# issue events, and in each code repo for CI and review events). The call is only a wake-up; the woken agent
# still decides from its own checks.
# Each role's fire token is found by NAME: crew.json roles.<role>.secret. Every secret is exported as an env var in
# one step (never echoed) and route.sh reads the variable the config names. Call with `secrets: inherit`.
# Batched roles (crew.json roles.<role>.batched) are queued as `wake-<role>` labels; a workflow_dispatch of the caller
# (an external clock or a schedule, every 2 h) runs the tick job, which fires each queued role once.
on:
  workflow_call:
    inputs:
      plan_repo:
        description: Plan repo (owner/name) that holds crew.json
        type: string
        required: true
      harness_repo:
        description: Harness repo (owner/name)
        type: string
        required: true
      harness_ref:
        description: Harness branch, tag or sha
        type: string
        required: true
      ci_workflow:
        description: Name of the CI workflow in the code repo, as workflow_run reports it
        type: string
        default: ci
      review_workflow:
        description: Name of the review workflow (the crew-review caller)
        type: string
        default: crew-review

permissions:
  contents: read
  issues: write         # wake-<role> queue labels and harness-blocker issues
  pull-requests: write  # labelling a PR wake-<role>
  actions: read         # tick: main CI state

jobs:
  fire:
    # Cheap prefilter so most events (run-lock comments, other labels, other repos) skip without a runner.
    # Issue events count only in the plan repo; CI and review runs come from wherever the caller is installed.
    # Debate turns also come from App bots (author_association is not OWNER); route.sh reads roles from logins.
    if: >-
      (github.event_name == 'issue_comment' &&
       (github.repository == inputs.plan_repo ||
        (github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, '@'))) &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) || github.event.comment.user.type == 'Bot') &&
       (github.event.comment.user.type == 'Bot' ||
        (!contains(github.event.comment.body, '<!-- agent -->') &&
         !contains(github.event.comment.body, 'Generated by [Claude Code]') &&
         !contains(github.event.comment.body, 'run-metadata'))) &&
       (contains(github.event.comment.body, '@') ||
        (github.event.issue.pull_request == null &&
         (contains(github.event.issue.labels.*.name, 'debate') || contains(github.event.issue.labels.*.name, 'needs-owner'))))) ||
      (github.event_name == 'issues' && github.repository == inputs.plan_repo && github.event.action == 'labeled' &&
       contains(fromJSON('["needs-rescue","needs-research","needs-work","debate"]'), github.event.label.name)) ||
      (github.event_name == 'issues' && github.repository == inputs.plan_repo && github.event.action == 'closed' &&
       (contains(github.event.issue.labels.*.name, 'needs-rescue') || contains(github.event.issue.labels.*.name, 'needs-owner') ||
        contains(github.event.issue.labels.*.name, 'needs-research') || contains(github.event.issue.labels.*.name, 'needs-work'))) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.name == inputs.review_workflow &&
       github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.name == inputs.ci_workflow && github.event.workflow_run.conclusion == 'failure' &&
       (github.event.workflow_run.head_branch == github.event.repository.default_branch ||
        (github.event.workflow_run.event == 'pull_request' && startsWith(github.event.workflow_run.head_branch, 'claude/') &&
         github.event.workflow_run.head_repository.full_name == github.repository)))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # Short-lived token from the crew's GitHub App (created by `crew apps create --single`), so no personal
      # access token is needed. Falls back to CREW_REPO_TOKEN, then to the workflow token.
      - id: crewtok
        if: ${{ vars.CREW_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CREW_APP_ID }}
          private-key: ${{ secrets.CREW_APP_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.harness_repo }}
          ref: ${{ inputs.harness_ref }}
          path: harness
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.plan_repo }}
          token: ${{ steps.crewtok.outputs.token || secrets.CREW_REPO_TOKEN || github.token }}
          path: plan
          sparse-checkout: crew.json
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ steps.crewtok.outputs.token || secrets.CREW_REPO_TOKEN || github.token }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
          CREW_CONFIG: ${{ github.workspace }}/plan/crew.json
          CREW_PLAN_DIR: ${{ github.workspace }}/plan
          CREW_CODE_DIR: ${{ github.workspace }}/plan
          CREW_CI_WORKFLOW: ${{ inputs.ci_workflow }}
          CREW_REVIEW_WORKFLOW: ${{ inputs.review_workflow }}
        run: |
          # Export every secret under its own name so route.sh can read roles.<role>.secret. GH_TOKEN stays as set above.
          # shellcheck disable=SC1090
          . <(jq -r 'to_entries[] | select((.key|test("^[A-Za-z_][A-Za-z0-9_]*$")) and (.key|ascii_downcase != "github_token") and (.key != "GH_TOKEN")) | "export \(.key)=\(.value|@sh)"' <<<"$SECRETS_JSON")
          unset SECRETS_JSON
          bash harness/scripts/route.sh event "$GITHUB_EVENT_PATH" | while IFS=$'\t' read -r role why; do
            bash harness/scripts/route.sh fire "$role" "$why"
          done

  tick:
    if: github.event_name == 'workflow_dispatch' && github.repository == inputs.plan_repo
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Short-lived token from the crew's GitHub App (created by `crew apps create --single`), so no personal
      # access token is needed. Falls back to CREW_REPO_TOKEN, then to the workflow token.
      - id: crewtok
        if: ${{ vars.CREW_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CREW_APP_ID }}
          private-key: ${{ secrets.CREW_APP_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.harness_repo }}
          ref: ${{ inputs.harness_ref }}
          path: harness
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.plan_repo }}
          token: ${{ steps.crewtok.outputs.token || secrets.CREW_REPO_TOKEN || github.token }}
          path: plan
          sparse-checkout: crew.json
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ steps.crewtok.outputs.token || secrets.CREW_REPO_TOKEN || github.token }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
          CREW_CONFIG: ${{ github.workspace }}/plan/crew.json
          CREW_PLAN_DIR: ${{ github.workspace }}/plan
          CREW_CODE_DIR: ${{ github.workspace }}/plan
          CREW_CI_WORKFLOW: ${{ inputs.ci_workflow }}
          CREW_REVIEW_WORKFLOW: ${{ inputs.review_workflow }}
        run: |
          # Export every secret under its own name so route.sh can read roles.<role>.secret. GH_TOKEN stays as set above.
          # shellcheck disable=SC1090
          . <(jq -r 'to_entries[] | select((.key|test("^[A-Za-z_][A-Za-z0-9_]*$")) and (.key|ascii_downcase != "github_token") and (.key != "GH_TOKEN")) | "export \(.key)=\(.value|@sh)"' <<<"$SECRETS_JSON")
          unset SECRETS_JSON
          bash harness/scripts/route.sh tick
